    one coherent family with 22 compared interfaces: 18 main interfaces and 4 explicitly disclosed unit-gap/range
    support roots. All original source types, quantified domains, strict bounds, feasible-instance conditions,
    full ordered matrix constants and actual fixed-coordinate maps are retained. Generic fixed energy
    permits arbitrary real fixed values when stated; minimizer transport retains binary consistency. Literal
    fixed-coordinate transport retains allowed depot-loop consistency. No equality-threshold exactness,
    sharp/minimal penalty, capacity/global catalogue/grid completeness, historical solver behavior, hardware
    energy convention or quantum performance is established.'
