version: v0.4
project:
  name: Finite integer penalties and literal routing QUBO transport
  description: 'A complete source-based finite penalty/energy family: the generic full ordered QUBO identity
    and strict integer-row minimizer equivalence, consistent fixed-coordinate energy/minimizer transport,
    and the literal incidence, time-indexed arc and sequence applications. The statements retain actual
    rows, repeated costs, full offsets, source free/fixed partitions, feasibility conditions, strict sufficient
    thresholds and finite source energy attainment. Capacity, physical route completeness and solver/quantum
    performance are outside scope.'
  authors:
  - David E. Bernal Neira
  responsible_maintainers:
  - David E. Bernal Neira
  license: Apache-2.0
repository:
  role: substantive-development
